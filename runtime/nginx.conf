user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format cloud_safe escape=json '{"method":"$request_method","status":$status,"bytes":$body_bytes_sent,"request_id":"$request_id"}';
  access_log /dev/stdout cloud_safe;
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Spartan-Client-IP;
  real_ip_recursive off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  # Bundles and pages crossed the tunnel uncompressed. Proxied Octane responses are
  # compressed too (gzip_proxied any); the agent and the Worker pass the encoding through.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
  server {
    listen 8080;
    root /var/www/html/public;
    index index.html;
    client_max_body_size 32m;
    location = /__cloud_health {
      include /etc/nginx/octane-proxy.conf;
    }
    # Vite names every bundle after its content hash, so a file under /build/assets never
    # changes: browsers and Cloudflare may keep it for a year instead of re-downloading
    # every script and stylesheet on each page visit. A new build has new file names.
    location /build/assets/ {
      include /etc/nginx/spartan-origin-auth.conf;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      include /etc/nginx/spartan-origin-auth.conf;
      try_files $uri @octane;
    }
    location = /index.php {
      include /etc/nginx/spartan-origin-auth.conf;
      rewrite ^ / break;
      include /etc/nginx/octane-proxy.conf;
    }
    location @octane {
      include /etc/nginx/spartan-origin-auth.conf;
      include /etc/nginx/octane-proxy.conf;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
  }
}
