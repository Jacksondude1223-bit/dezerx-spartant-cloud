user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Spartan-Client-IP;
  real_ip_recursive off;
  sendfile on;
  server_tokens off;
  server {
    listen 8080;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 32m;
    location = /__cloud_health {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public/__cloud_health.php;
      fastcgi_pass 127.0.0.1:9000;
    }
    location / { include /etc/nginx/spartan-origin-auth.conf; try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
      include /etc/nginx/spartan-origin-auth.conf;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
      fastcgi_param HTTPS on;
      fastcgi_param SERVER_PORT 443;
      fastcgi_param HTTP_X_FORWARDED_PROTO https;
      fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
      fastcgi_param HTTP_X_REAL_IP $remote_addr;
      fastcgi_param HTTP_CF_CONNECTING_IP $remote_addr;
      fastcgi_param HTTP_X_SPARTAN_INGRESS_KEY "";
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
  }
}
