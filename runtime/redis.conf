bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
logfile ""
dir /var/www/html/storage/container/redis
appendonly yes
appendfsync everysec
# Redis is the application cache and, outside the US-central database mode, the session
# store. Under memory pressure it drops the least recently used keys instead of refusing
# writes (noeviction turned a full cache into failed page loads).
maxmemory 128mb
maxmemory-policy allkeys-lru
