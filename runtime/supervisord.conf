[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
[program:php]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:queue]
command=/bin/sh -c 'if [ "$CLOUD_ROLE" = primary ]; then exec php artisan queue:work --sleep=3 --tries=3 --timeout=50 --max-time=3600; else exec sleep infinity; fi'
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:scheduler]
command=/bin/sh -c 'if [ "$CLOUD_ROLE" = primary ]; then exec php artisan schedule:work; else exec sleep infinity; fi'
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
