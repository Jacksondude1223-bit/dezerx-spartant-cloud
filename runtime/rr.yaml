version: "3"
server:
  command: "php vendor/bin/roadrunner-worker"
  relay: pipes
rpc:
  listen: tcp://127.0.0.1:6001
http:
  address: 127.0.0.1:8000
  middleware: []
  # octane:start overrides both from OCTANE_WORKERS / OCTANE_MAX_REQUESTS (entrypoint.sh).
  pool:
    num_workers: 4
    max_jobs: 10000
logs:
  mode: production
  level: warn
  output: stdout
  encoding: json
