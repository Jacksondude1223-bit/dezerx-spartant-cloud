compatibility_date = "2026-10-01"
name = "dezerx-spartant-cloud"
main = "routing.js"
workers_dev = true

[observability]
enabled = true

[vars]
MAX_CUSTOM_HOSTNAMES = "30"
BASE_DOMAIN = "cloud.example.com"
US_ORIGIN = "https://node-us.example.com"
DE_ORIGIN = "https://node-de.example.com"
CLOUDFLARE_ZONE_ID = "CHANGE_ME"
SAAS_ZONE_DOMAIN = "example.com"
SAAS_CNAME_TARGET = "cloud.example.com"


[durable_objects]

[[durable_objects.bindings]]
name = "TENANTS"
class_name = "RoutingTenant"

[[durable_objects.bindings]]
name = "DOMAINS"
class_name = "Domains"

[[migrations]]
tag = "routing-v1"
new_sqlite_classes = ["RoutingTenant", "Domains"]

[triggers]
crons = ["0 */6 * * *"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
