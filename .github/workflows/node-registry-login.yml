name: Configure node registry access

on:
  workflow_dispatch:
    inputs:
      image:
        description: Spartan image digest to pull on both nodes
        required: true
        default: ghcr.io/dezer-x/dezerx-spartan@sha256:b681836d7bb0bae11e26891d3431f50ce5f35daf9a5efbf0bb45ffa10924ea9a
        type: string

permissions: {}

concurrency:
  group: node-registry-login
  cancel-in-progress: false

jobs:
  registry-login:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: us
            host_secret: US_SSH_HOST
            user_secret: US_SSH_USER
            port_variable: US_SSH_PORT
          - region: de
            host_secret: DE_SSH_HOST
            user_secret: DE_SSH_USER
            port_variable: DE_SSH_PORT
    name: Configure ${{ matrix.region }} node
    steps:
      - name: Authenticate and pull Spartan image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || 'Jacksondude1223-bit' }}
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
          NODE_SSH_KNOWN_HOSTS: ${{ secrets.NODE_SSH_KNOWN_HOSTS }}
          NODE_SSH_HOST: ${{ secrets[matrix.host_secret] }}
          NODE_SSH_USER: ${{ secrets[matrix.user_secret] }}
          NODE_SSH_PORT: ${{ vars[matrix.port_variable] || '22' }}
          SPARTAN_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          for field in GHCR_TOKEN NODE_SSH_PRIVATE_KEY NODE_SSH_KNOWN_HOSTS NODE_SSH_HOST NODE_SSH_USER; do
            if [ -z "${!field}" ]; then printf 'Missing repository secret: %s\n' "$field" >&2; exit 1; fi
          done
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || { printf 'Invalid GHCR username.\n' >&2; exit 1; }
          [[ "$NODE_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || { printf 'Invalid SSH host.\n' >&2; exit 1; }
          [[ "$NODE_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { printf 'Invalid SSH user.\n' >&2; exit 1; }
          [[ "$NODE_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$NODE_SSH_PORT >= 1 && 10#$NODE_SSH_PORT <= 65535)) || { printf 'Invalid SSH port.\n' >&2; exit 1; }
          [[ "$SPARTAN_IMAGE" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]] || { printf 'A GHCR image with a SHA256 digest is required.\n' >&2; exit 1; }
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          printf '%s\n' "$NODE_SSH_PRIVATE_KEY" > "$work_dir/key"
          printf '%s\n' "$NODE_SSH_KNOWN_HOSTS" > "$work_dir/known_hosts"
          unset NODE_SSH_PRIVATE_KEY NODE_SSH_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$work_dir/key" >/dev/null
          host_entry="$NODE_SSH_HOST"
          if ((10#$NODE_SSH_PORT != 22)); then host_entry="[$NODE_SSH_HOST]:$NODE_SSH_PORT"; fi
          ssh-keygen -F "$host_entry" -f "$work_dir/known_hosts" >/dev/null || { printf 'Missing pinned SSH host key for node.\n' >&2; exit 1; }
          remote_command="sudo -n sh -c 'umask 077; install -d -m 700 /etc/spartan-cloud/docker; export DOCKER_CONFIG=/etc/spartan-cloud/docker; docker login ghcr.io -u \"\$1\" --password-stdin && docker pull \"\$2\"' sh '$GHCR_USERNAME' '$SPARTAN_IMAGE'"
          printf '%s\n' "$GHCR_TOKEN" | env -u GHCR_TOKEN ssh -F /dev/null -T \
            -i "$work_dir/key" -p "$NODE_SSH_PORT" -l "$NODE_SSH_USER" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -- "$NODE_SSH_HOST" "$remote_command"
          unset GHCR_TOKEN
